name: update-liquidation-map

# RELIABLE ~10-minute cadence on a free public repo.
#
# Why not just `cron: "*/10 * * * *"`? GitHub's scheduled triggers are best-effort
# and heavily throttled on low-activity repos — in practice "*/10" fires roughly
# once an hour, which is exactly the "sporadic updates" problem.
#
# Fix: a single job runs an INTERNAL loop that rebuilds the map every 10 minutes for
# ~110 minutes, committing each snapshot. An hourly cron (infrequent crons ARE
# honored reliably) plus `cancel-in-progress` relaunches a fresh loop each hour, so
# the 10-min cadence is continuous even if a cron tick is delayed or skipped. Public
# repos get unlimited Actions minutes, so the long-running loop is free.
#
# The Airflow DAG in dags/ remains the PoC orchestration artifact; this is just the
# always-on runner for the live page. The map is not backfillable, so the CFI
# time-series accumulates forward (committed back to data/).

on:
  schedule:
    - cron: "7 * * * *"        # hourly relauncher (offset off the congested :00)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: liq-map-update
  cancel-in-progress: true      # each relaunch replaces the running loop

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update loop (pipeline every ~10 min for ~110 min)
        run: |
          git config user.name  "liq-map-bot"
          git config user.email "actions@users.noreply.github.com"
          END=$(( $(date +%s) + 110*60 ))
          CADENCE=600
          i=0
          while :; do
            i=$((i+1)); START=$(date +%s)
            echo "::group::iteration $i ($(date -u +%H:%M:%SZ))"
            python run_pipeline.py --wallets 2000 || echo "pipeline iteration failed, continuing"
            git add docs/index.html docs/data.json data/metrics_history.csv data/cfi_history.jsonl data/map_history.jsonl data/latest_snapshot.json data/wallet_universe.csv data/wallet_universe_meta.json
            if git diff --staged --quiet; then
              echo "no changes to commit"
            else
              git commit -m "data: liquidation map snapshot [skip ci]"
              git pull --rebase --autostash origin main || true
              git push || echo "push failed; retrying next iteration"
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -ge "$END" ] && break
            # adaptive sleep: keep ~10 min between iteration STARTS despite the longer fetch
            ELAPSED=$(( $(date +%s) - START )); SLEEP=$(( CADENCE - ELAPSED ))
            [ "$SLEEP" -lt 60 ] && SLEEP=60
            echo "iteration took ${ELAPSED}s; sleeping ${SLEEP}s"
            sleep "$SLEEP"
          done
